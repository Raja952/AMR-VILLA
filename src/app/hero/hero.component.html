<section class="hero">
  <div class="hero__overlay"></div>

  <div class="container hero__content">
    <span class="hero__badge">★ Premium Handpicked Villas</span>
    <h1>Find Your Perfect <span>Villa Stay</span></h1>
    <p>
      Discover handpicked premium villas designed for comfort, privacy and unforgettable
      experiences — for a peaceful escape, a family vacation, or a celebration with loved ones.
    </p>
    <p class="hero__tag">Book. Relax. Experience.</p>
    <div class="hero__actions">
      <a href="#featured" class="btn btn--primary">Explore Villas</a>
      <a href="#about" class="btn btn--ghost">Learn More</a>
    </div>
  </div>

  <form class="enquiry container" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label>Name</label>
      <input type="text" formControlName="name" placeholder="Your full name"
             [class.invalid]="submitted && form.controls.name.invalid">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="you@example.com"
             [class.invalid]="submitted && form.controls.email.invalid">
    </div>
    <div class="field">
      <label>Phone</label>
      <input type="tel" formControlName="phone" placeholder="10-digit number"
             [class.invalid]="submitted && form.controls.phone.invalid">
    </div>
    <div class="field">
      <label>Check-in Date</label>
      <input type="date" formControlName="date"
             [class.invalid]="submitted && form.controls.date.invalid">
    </div>
    <button type="submit" class="btn btn--primary">Check Availability</button>
  </form>
</section>
